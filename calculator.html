<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1c1c1e; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; padding: 12px; }
    #display { background: transparent; color: #fff; font-size: 2.2rem; text-align: right; padding: 8px; border: none; outline: none; width: 100%; margin-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; }
    button { background: #333336; color: #fff; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; }
    button:active { opacity: 0.7; }
    button.op { background: #ff9f0a; }
    button.action { background: #a5a5a5; color: #000; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <input type="text" id="display" readonly value="0">
  <div class="grid">
    <button class="action" onclick="clearDisplay()">C</button>
    <button class="action" onclick="toggleSign()">+/-</button>
    <button class="action" onclick="appendOp('%')">%</button>
    <button class="op" onclick="appendOp('/')">÷</button>
    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button class="op" onclick="appendOp('*')">×</button>
    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button class="op" onclick="appendOp('-')">-</button>
    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button class="op" onclick="appendOp('+')">+</button>
    <button class="zero" onclick="appendNum('0')">0</button>
    <button onclick="appendNum('.')">.</button>
    <button class="op" onclick="calculate()">=</button>
  </div>
  <script>
    const display = document.getElementById('display');
    let reset = false;

    function appendNum(num) {
      if (display.value === '0' || reset) {
        display.value = num;
        reset = false;
      } else {
        display.value += num;
      }
    }

    function appendOp(op) {
      display.value += ' ' + op + ' ';
      reset = false;
    }

    function clearDisplay() {
      display.value = '0';
    }

    function toggleSign() {
      if (display.value !== '0') {
        display.value = display.value.startsWith('-') ? display.value.slice(1) : '-' + display.value;
      }
    }

    function calculate() {
      try {
        let expr = display.value.replace(/×/g, '*').replace(/÷/g, '/');
        display.value = Function('"use strict";return (' + expr + ')')();
        reset = true;
      } catch (e) {
        display.value = 'Error';
        reset = true;
      }
    }
  </script>
</body>
</html>
