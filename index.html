<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SereneOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen Overlay -->
  <div id="loading-screen">
    <div class="loading-title">SereneOS</div>
  </div>

  <!-- Main Desktop Environment -->
  <div id="desktop">
    <!-- Top System Bar -->
    <header class="top-bar">
      <div class="top-bar-left"></div>
      <div class="top-bar-center">SereneOS</div>
      <div class="top-bar-right">
        <span id="system-clock">--:-- --</span>
      </div>
    </header>

    <!-- Desktop Workspace Canvas -->
    <main class="desktop-canvas" id="desktop-canvas">
      
    </main>

    <!-- macOS Style Dock -->
    <nav class="dock">
      <div class="dock-item" data-app="calculator"></div>
      <div class="dock-item" data-app="notes"></div>
      <div class="dock-item" data-app="clock"></div>
      <div class="dock-item"></div>
      <div class="dock-item"></div>
      <div class="dock-item"></div>
    </nav>
  </div>

  <!--Clock app-->
  <nav class="dock">
  <div class="dock-item" data-app="calculator"></div>
  <div class="dock-item" data-app="notes"></div>
  <div class="dock-item" data-app="clock" onclick="launchApp('clock')">
    <img src="clock.png" alt="Clock" class="app-icon">
  </div>
  <div class="dock-item"></div>
  <div class="dock-item"></div>
  <div class="dock-item"></div>
</nav>

  <script src="script.js"></script>
</body>
</html>
