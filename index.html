<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SereneOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <audio id="bg-audio" src="bg.mp3" loop></audio>

  <!-- Loading Screen  -->
  <div id="loading-screen">
    <div class="loading-title">SereneOS</div>
  </div>

  <!-- Main Desktop screen -->
  <div id="desktop">
    
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="theme-toggle" class="theme-btn">
          <img id="theme-icon" src="sun.png" alt="Theme">
        </button>
      </div>
      <div class="top-bar-center">SereneOS</div>
      <div class="top-bar-right">
        <span id="system-clock">--:-- --</span>
      </div>
    </header>

  
    <main class="desktop-canvas" id="desktop-canvas">
      
    </main>

   
<nav class="dock">
  <div class="dock-item" data-app="calculator" onclick="launchApp('calculator')">
    <img src="calculator.png" alt="Calculator" class="app-icon">
  </div>
  <div class="dock-item" data-app="notes" onclick="launchApp('notes')">
    <img src="notes.png" alt="Notes" class="app-icon">
  </div>
  <div class="dock-item" data-app="clock" onclick="launchApp('clock')">
    <img src="clock.png" alt="Clock" class="app-icon">
  </div>
  <div class="dock-item"></div>
  <div class="dock-item"></div>
  <div class="dock-item"></div>
</nav>

  
  <script src="script.js"></script>
</body>
</html>
